<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mídias em HTML5</title>
</head>
<body>
    <h1>Imagem dinâmica</h1>
    <p>Tente abrir esse site em vários dispositivos diferentes ou simplesmente aumente e diminua o tamanho do seu navegador.</p>
    <!-- Maneira de fazer telas dinâmicas-->
    <picture>
        <source media="(max-width: 750px)" srcset="imagens/Rex_300.png" type="image/png">
        <source media="(max-width: 1050px)" srcset="imagens/Rex_700.png" type="image/png">
        <img src="imagens/Rex_1000.png" alt="T-Rex">
    </picture>

    <h1>Reproduzindo Áudio</h1>
    <p>Vamos aprender a reproduzir áudios em HTML5</p>
    <p>Rugido do Rex</p>
    <audio src="midia/rex_roar.mp3" controls></audio>
    <p>Chamado do Raptor</p>
    <audio preload="metadata" controls>
        <source src="midia/raptor.mp3"  type="audio/mpeg">
        <p>Infelizmente seu navegador não consegue reproduzir audio</p>
        <a href="midia/raptor.mp3">Clique aqui para baixar o arquivo MP3</a>
    </audio>
    <!--Formatos compatíveis: MP3 WAV OGG-->
</body>
</html>
